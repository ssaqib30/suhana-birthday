
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f5">
<title>For you maa Suhana ♡</title>

<style>
:root {
  --pink: #e75480;
  --deep: #873b59;
  --paper: #fffafd;
  --background: #fff0f5;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #633b4a;
  background: radial-gradient(circle at top, #fffafd, #ffe3ed 65%, #ffd5e5);
  overflow-x: hidden;
}

.petal {
  position: fixed;
  top: -30px;
  z-index: 0;
  pointer-events: none;
  color: #e98bab;
  animation: fall linear infinite;
  opacity: .6;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(480deg); }
}

main {
  position: relative;
  z-index: 1;
  width: min(760px, 92%);
  margin: 0 auto;
  padding: 42px 0;
}

.card {
  padding: clamp(22px, 5vw, 42px);
  background: rgba(255, 250, 253, .94);
  border: 1px solid #f7c9da;
  border-radius: 25px;
  box-shadow: 0 18px 55px #a84b6d18;
  text-align: center;
}

.heart {
  font-size: 65px;
  display: inline-block;
  animation: heartbeat 1.5s infinite;
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.13); }
  30% { transform: scale(1); }
  45% { transform: scale(1.08); }
}

h1 {
  font-size: clamp(2rem, 7vw, 3.1rem);
  color: var(--pink);
  margin: 12px 0;
}
.intro {
  line-height: 1.8;
  white-space: pre-line;
}
button {
  border: 0;
  border-radius: 30px;
  padding: 13px 21px;
  margin: 7px 4px;
  font-size: 1rem;
  cursor: pointer;
  background: var(--pink);
  color: white;
  font-family: inherit;
  box-shadow: 0 5px 15px #e7548030;
}
button.secondary {
  background: #fff0f5;
  color: var(--deep);
  border: 1px solid #f3c2d4;
}
button:hover { transform: translateY(-1px); }

#letterSection {
  display: none;
  margin-top: 28px;
  text-align: left;
  animation: appear .7s ease;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.letter-paper {
  padding: clamp(20px, 5vw, 34px);
  background: var(--paper);
  border: 1px solid #f4d5e0;
  border-radius: 18px;
  line-height: 1.95;
  overflow-wrap: anywhere;
}
#letterHeading {
  text-align: center;
  color: var(--pink);
  font-size: 1.6rem;
}
#letterText {
  white-space: pre-line;
}
.signature {
  margin-top: 24px;
  text-align: right;
  font-style: italic;
  color: var(--deep);
}
.editor {
  display: none;
  text-align: left;
  margin-top: 28px;
  padding: 24px;
  background: #fff4f8;
  border: 1px solid #f2c8d8;
  border-radius: 18px;
}
.editor h2 { color: var(--pink); }
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border: 1px solid #e9b8cb;
  border-radius: 10px;
  font: inherit;
  color: #633b4a;
  background: white;
}
textarea {
  min-height: 110px;
  resize: vertical;
}
.note {
  font-size: .9rem;
  line-height: 1.6;
  color: #865c6b;
}
footer {
  text-align: center;
  font-size: .9rem;
  margin-top: 22px;
  opacity: .8;
}
</style>
</head>

<body>
<main>
  <section class="card">
    <div class="heart">♡</div>
    <h1 id="openingTitle">For you maa Suhana ♡</h1>
    <p class="intro" id="openingIntro"></p>

    <button id="openButton">Open my heart ♡</button>

    <section id="letterSection">
      <article class="letter-paper">
        <h2 id="letterHeading"></h2>
        <div id="letterText"></div>
        <div class="signature" id="signature"></div>
      </article>
    </section>

    <div style="margin-top:20px">
      <button class="secondary" id="editorButton">Edit my message ✍️</button>
    </div>

    <section class="editor" id="editor">
      <h2>Make it yours ♡</h2>
      <p class="note">
        Edit the text below to preview your changes. These edits are saved
        only in this browser. To publish a message for everyone, update the
        original text in index.html on GitHub and commit the changes.
      </p>

      <label for="titleInput">Opening title</label>
      <input id="titleInput">

      <label for="introInput">Opening introduction</label>
      <textarea id="introInput"></textarea>

      <label for="headingInput">Letter heading</label>
      <input id="headingInput">

      <label for="letterInput">Complete letter</label>
      <textarea id="letterInput" style="min-height:280px"></textarea>

      <label for="signatureInput">Sign-off</label>
      <input id="signatureInput">

      <button id="saveButton">Save changes ♡</button>
      <button class="secondary" id="previewButton">Preview full letter</button>
      <button class="secondary" id="restoreButton">Restore published message</button>
      <p class="note" id="saveStatus" aria-live="polite"></p>
    </section>
  </section>

  <footer>Made with love, just for you ♡</footer>
</main>

<script>
"use strict";

/* PUBLISHED DEFAULT MESSAGE — this appears on every device. */
const original = {
  title: "For you maa Suhana ♡",

  intro: "Some feelings deserve their own little place. I know you're not getting a phone, but please take a quiet moment and open this when you're ready 💗",

  heading: "I think you're okay sorry maa for all this thinks mere ghalti my phn lock karna tha soo ❤️",
  
  letter: `Assalamualaikum ❤️

First, I'm sorry. I'm sorry I've been so busy with my studies lately and that we haven't talked as much as before. In the beginning, I miss our old days, and I miss you a lot, more than I always know how to say.

Right now, I'm in my building phase. I'm working on myself, my studies, and our future. I'm not trying to become a stranger to you; I'm trying to become a better version of myself 🤍

When I think about the future, I make dua that Allah guides us toward what is best for both of us. And if it's written for us, InshaAllah, one day we'll look back at this building phase and smile at how far we've come 🤲🏻

I'm building myself today, but I hope that one day we can look at each other and say, "We made it."

Can you wait for me? You know my aadat. Once again, I'm saying I'm not forcing you. This is completely your choice. When you think you want to leave, just know your happiness matters to me.

You're thinking that I'm ignoring you, but no, I never am. Tujj phn meleso time manj mlm ho ra neee, sorry. There are some important things I want to tell you, but not in a message.

I miss you maaaaaaaa. I love you ❤️

May Allah always protect you and keep that beautiful smile on your face. ❤️`,

  signature: "With love, and a prayer for our future ♡"
};

const STORAGE_KEY = "suhanaLoveNote";

const $ = id => document.getElementById(id);

const fields = {
  title: $("titleInput"),
  intro: $("introInput"),
  heading: $("headingInput"),
  letter: $("letterInput"),
  signature: $("signatureInput")
};

let current = { ...original };

function render() {
  $("openingTitle").textContent = current.title;
  $("openingIntro").textContent = current.intro;
  $("letterHeading").textContent = current.heading;
  $("letterText").textContent = current.letter;
  $("signature").textContent = current.signature;

  fields.title.value = current.title;
  fields.intro.value = current.intro;
  fields.heading.value = current.heading;
  fields.letter.value = current.letter;
  fields.signature.value = current.signature;
}

function readEditor() {
  return {
    title: fields.title.value,
    intro: fields.intro.value,
    heading: fields.heading.value,
    letter: fields.letter.value,
    signature: fields.signature.value
  };
}

function previewEditor() {
  current = readEditor();
  render();
  $("letterSection").style.display = "block";
}

function saveEdits() {
  current = readEditor();

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
    $("saveStatus").textContent =
      "Saved in this browser only. To share these edits, publish them in index.html on GitHub.";
  } catch (error) {
    $("saveStatus").textContent =
      "Your browser could not save these edits. You can still preview the letter.";
  }

  render();
  $("letterSection").style.display = "block";
}

function restorePublishedMessage() {
  current = { ...original };

  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    /* The published default still works if storage is unavailable. */
  }

  render();
  $("saveStatus").textContent = "Restored the published message.";
  $("letterSection").style.display = "block";
}

function loadLocalEdits() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    const parsed = JSON.parse(saved);
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return;

    for (const key of Object.keys(original)) {
      if (typeof parsed[key] === "string") {
        current[key] = parsed[key];
      }
    }
  } catch (error) {
    current = { ...original };
  }
}

$("openButton").addEventListener("click", () => {
  $("letterSection").style.display = "block";
  $("letterSection").scrollIntoView({ behavior: "smooth", block: "start" });
});

$("editorButton").addEventListener("click", () => {
  const editor = $("editor");
  editor.style.display = editor.style.display === "block" ? "none" : "block";
});

$("saveButton").addEventListener("click", saveEdits);
$("previewButton").addEventListener("click", previewEditor);
$("restoreButton").addEventListener("click", restorePublishedMessage);

/* Live preview while editing. */
for (const field of Object.values(fields)) {
  field.addEventListener("input", () => {
    current = readEditor();
    render();
  });
}

/* Gentle falling petals. */
for (let i = 0; i < 18; i++) {
  const petal = document.createElement("div");
  petal.className = "petal";
  petal.textContent = Math.random() > 0.5 ? "♡" : "✿";
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.animationDuration = (9 + Math.random() * 12) + "s";
  petal.style.animationDelay = (-Math.random() * 18) + "s";
  petal.style.fontSize = (12 + Math.random() * 15) + "px";
  document.body.appendChild(petal);
}

/*
  Load this published message by default on every device.
  Local edits are restored only on the browser where they were saved.
*/
loadLocalEdits();
render();
</script>
</body>
</html>
